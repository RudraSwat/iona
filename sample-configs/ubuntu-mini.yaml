name: 'Ubuntu Mini'

codename: 'noble'

repos:
    - url: 'http://archive.ubuntu.com/ubuntu'
      components:
        - 'main'
        - 'universe'
        - 'multiverse'
        - 'restricted'
      suites:
        - 'noble'
        - 'noble-updates'
      deb-src: false

    - url: 'http://security.ubuntu.com/ubuntu'
      components:
        - 'main'
        - 'universe'
        - 'multiverse'
        - 'restricted'
      suites:
        - 'noble-security'
      deb-src: false

post-workarounds:
    - name: 'ubuntu-network'

artifacts:
    - type: 'iso'
      name: 'mini.iso'
